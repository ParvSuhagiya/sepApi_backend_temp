name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "ruff==0.14.9" "mypy==1.18.2" "pytest-cov==7.0.0" "pip-audit==2.9.0"
      - name: Ruff lint (new package)
        working-directory: backend
        run: python -m ruff check app/modes
      - name: Ruff format check (new package)
        working-directory: backend
        run: python -m ruff format --check app/modes
      - name: Mypy (new package, non-strict)
        working-directory: backend
        run: python -m mypy app/modes
      - name: Run tests with coverage gate
        working-directory: backend
        run: python -m pytest -q --cov=app/modes/customers --cov-fail-under=85
      - name: OpenAPI contract freshness
        working-directory: backend
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json
      - name: Dependency audit (non-blocking report)
        working-directory: backend
        continue-on-error: true
        run: pip-audit --desc on || true

  frontend:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests with coverage (features/ and lib/ >= 85%)
        working-directory: frontend
        run: npm test -- --run --coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Route bundle budgets
        working-directory: frontend
        run: npm run size-check
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e + axe
        working-directory: frontend
        run: npm run test:e2e
      - name: Ensure no API keys in source or bundle
        working-directory: frontend
        run: "! grep -rn 'sk-\\|AIza\\|gsk_\\|SERPAPI\\|API_KEY' src dist || (echo 'API key found in frontend' && exit 1)"
      - name: Dependency audit (non-blocking report)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev || true
      - name: Lighthouse CI (optional)
        working-directory: frontend
        continue-on-error: true
        run: |
          if [ -f lighthouserc.json ]; then npx -y @lhci/cli autorun; else echo "no lighthouserc.json; skipping Lighthouse CI"; fi
