# mypy configuration for the EarnRadar backend.
#
# The quality gate is: `mypy app/modes` reports no errors. The ignores below
# cover pre-existing findings in legacy income-mode/shared files that this
# gate deliberately leaves untouched (see `git log` for their history):
# - app.budget / app.config / app.services.serp predate the customer-mode
#   package and are pulled in only via imports.

[mypy]
python_version = 3.11
show_error_codes = True

[mypy-app.budget]
ignore_errors = True

[mypy-app.config]
ignore_errors = True

[mypy-app.services.serp]
ignore_errors = True
