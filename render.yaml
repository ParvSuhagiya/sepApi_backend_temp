services:
  - type: web
    name: earnrader-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: APP_ENV
        value: production
      - key: SERPAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: MAX_SERP_CALLS_PER_DAY
        sync: false
      - key: MAX_LLM_CALLS_PER_DAY
        sync: false
      - key: ENABLE_DOCS
        sync: false
      - key: SCORE_MODE
        sync: false
      - key: RANK_CACHE_HOURS
        sync: false
      - key: RATE_LIMIT_SEARCH_PER_HOUR
        sync: false
      - key: RATE_LIMIT_OUTREACH_PER_HOUR
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: TTL_JOBS_HOURS
        sync: false
      - key: TTL_MAPS_HOURS
        sync: false
      - key: TTL_TRENDS_HOURS
        sync: false
      - key: TTL_FORUMS_HOURS
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        sync: false
      - key: SERP_TIMEOUT_SECONDS
        sync: false
      - key: ENABLE_CUSTOMER_MODE
        sync: false
      - key: LEAD_RESEARCH_TOP_N
        sync: false
      - key: MAX_LEAD_SERP_CALLS_PER_REQUEST
        sync: false
      - key: MAX_LEAD_SERP_CALLS_PER_DAY
        sync: false
      - key: LEADS_REQUEST_DEADLINE_SECONDS
        sync: false
      - key: RATE_LIMIT_LEADS_PER_HOUR
        sync: false
      - key: LEADS_CACHE_HOURS
        sync: false
      - key: GEOCODE_ENABLED
        sync: false
      - key: GEOCODE_PROVIDER
        sync: false
      - key: GEOCODE_BASE_URL
        sync: false
      - key: GEOCODE_USER_AGENT
        sync: false
      - key: GEOCODE_MAX_PER_REQUEST
        sync: false
