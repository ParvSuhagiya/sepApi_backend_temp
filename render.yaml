services:
  - type: web
    name: earnrader-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: APP_ENV
        value: production
      - key: SERPAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: MAX_SERP_CALLS_PER_DAY
        sync: false
      - key: MAX_LLM_CALLS_PER_DAY
        sync: false
      - key: ENABLE_DOCS
        sync: false
      - key: SCORE_MODE
        sync: false
      - key: RANK_CACHE_HOURS
        sync: false
      - key: RATE_LIMIT_SEARCH_PER_HOUR
        sync: false
      - key: RATE_LIMIT_OUTREACH_PER_HOUR
        sync: false
      - key: LOG_LEVEL
        sync: false
