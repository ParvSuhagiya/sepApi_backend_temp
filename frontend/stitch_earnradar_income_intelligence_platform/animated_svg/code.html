<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_19 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_19" style="display:block;"><svg class="w-full h-full" height="100%" viewbox="0 0 500 500" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Background Radial Gradient -->
<radialgradient cx="50%" cy="50%" id="radarGlow" r="50%">
<stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"></stop>
<stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"></stop>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
</radialgradient>
<!-- Rotating Sweep Gradient -->
<lineargradient id="sweepGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#4f46e5" stop-opacity="0.45"></stop>
<stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#4f46e5" stop-opacity="0"></stop>
</lineargradient>
<!-- Pulse Filter Glow -->
<filter height="140%" id="glow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="3"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<style>
    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes blipBlink1 {
      0%, 100% { r: 5; opacity: 1; }
      50% { r: 9; opacity: 0.4; }
    }
    @keyframes blipBlink2 {
      0%, 100% { r: 4; opacity: 0.9; }
      50% { r: 7.5; opacity: 0.3; }
    }
    .sweep-arm {
      transform-origin: 250px 250px;
      animation: rotateSweep 4s linear infinite;
    }
    .grid-ring {
      transform-origin: 250px 250px;
      animation: pulseRing 3s ease-in-out infinite;
    }
    .blip-1 { animation: blipBlink1 2s ease-in-out infinite; }
    .blip-2 { animation: blipBlink2 2.5s ease-in-out infinite 0.5s; }
  </style>
<!-- Background Base -->
<circle cx="250" cy="250" fill="url(#radarGlow)" r="230"></circle>
<!-- Concentric Radar Range Rings -->
<circle class="grid-ring" cx="250" cy="250" fill="none" r="220" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1.5"></circle>
<circle cx="250" cy="250" fill="none" r="165" stroke="#cbd5e1" stroke-width="1.5"></circle>
<circle cx="250" cy="250" fill="none" r="110" stroke="#cbd5e1" stroke-dasharray="6 3" stroke-width="1.2"></circle>
<circle cx="250" cy="250" fill="none" r="55" stroke="#94a3b8" stroke-width="1.5"></circle>
<!-- Crosshairs -->
<line stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1.2" x1="20" x2="480" y1="250" y2="250"></line>
<line stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1.2" x1="250" x2="250" y1="20" y2="480"></line>
<!-- Diagonal Scopes -->
<line stroke="#e2e8f0" stroke-width="1" x1="87" x2="413" y1="87" y2="413"></line>
<line stroke="#e2e8f0" stroke-width="1" x1="87" x2="413" y1="413" y2="87"></line>
<!-- Radar Scanning Conic Sector -->
<g class="sweep-arm">
<path d="M 250 250 L 250 30 A 220 220 0 0 1 405 95 Z" fill="url(#sweepGradient)"></path>
<!-- Leading Beam Line -->
<line filter="url(#glow)" stroke="#4f46e5" stroke-width="2.5" x1="250" x2="405" y1="250" y2="95"></line>
<circle cx="405" cy="95" fill="#06b6d4" filter="url(#glow)" r="4"></circle>
</g>
<!-- Radar Blips (Active Leads & Opportunities in India Tier-2) -->
<!-- Blip 1: High Conviction B2B Lead (Indore Cloud Kitchen) -->
<g filter="url(#glow)">
<circle class="blip-1" cx="340" cy="170" fill="#10b981" r="7"></circle>
<circle cx="340" cy="170" fill="none" opacity="0.4" r="14" stroke="#10b981" stroke-width="1.5"></circle>
</g>
<text fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600" x="355" y="174">Cloud Kitchen ₹38k</text>
<!-- Blip 2: High Conviction Remote Contract (Shopify Hindi) -->
<g filter="url(#glow)">
<circle class="blip-2" cx="160" cy="330" fill="#4f46e5" r="6"></circle>
<circle cx="160" cy="330" fill="none" opacity="0.4" r="12" stroke="#4f46e5" stroke-width="1.5"></circle>
</g>
<text fill="#4f46e5" font-family="Inter, sans-serif" font-size="11" font-weight="600" x="75" y="334">Shopify Dev ₹35k</text>
<!-- Blip 3: B2B Sweet Shop Lead -->
<circle cx="370" cy="290" fill="#06b6d4" r="5"></circle>
<circle cx="370" cy="290" fill="none" opacity="0.5" r="10" stroke="#06b6d4" stroke-width="1"></circle>
<text fill="#0891b2" font-family="Inter, sans-serif" font-size="10" font-weight="500" x="382" y="294">Chhappan Bhog ₹20k</text>
<!-- Blip 4: Flagged Scam Intercepted -->
<circle cx="190" cy="140" fill="#ef4444" r="5.5"></circle>
<line stroke="#ffffff" stroke-width="1.5" x1="186" x2="194" y1="136" y2="144"></line>
<line stroke="#ffffff" stroke-width="1.5" x1="194" x2="186" y1="136" y2="144"></line>
<text fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600" x="110" y="135">Blocked Fake Gig</text>
<!-- Blip 5: High Value Gym Lead -->
<circle cx="210" cy="380" fill="#10b981" r="4.5"></circle>
<text fill="#047857" font-family="Inter, sans-serif" font-size="10" font-weight="500" x="222" y="384">Gold's Gym MP</text>
<!-- Center Radar Beacon -->
<circle cx="250" cy="250" fill="#4f46e5" filter="url(#glow)" r="7"></circle>
<circle cx="250" cy="250" fill="#ffffff" r="3"></circle>
<circle cx="250" cy="250" fill="none" opacity="0.3" r="18" stroke="#4f46e5" stroke-width="1"></circle>
<!-- Coordinates & Telemetry Label -->
<text fill="#64748b" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle" x="250" y="465">LIVE TELEMETRY SWEEP • TIER-2 GRID</text>
</svg></div><!-- STITCH_SVG_END:ANIMATION_19 -->
</body>
</html>
